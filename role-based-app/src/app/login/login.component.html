<div class="login-wrapper">
    <div class="login-home">
<h2>Login</h2>
    <form (ngSubmit)="login()">
      <input type="text" placeholder="Username" [(ngModel)]="username" name="username" required minlength="3"/>
      <input type="password" placeholder="Password" [(ngModel)]="password" name="password" required minlength="3"/>
      <button type="submit">Login</button>
    </form>
    </div>
</div>
